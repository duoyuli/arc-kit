# Codex provider configuration
#
# Each [section] is a switchable provider profile.
# Switch with: arc provider use <name> --agent codex
#
# Common fields (all strings):
#   display_name   Name shown when switching (required)
#   description    Short description (required)
#   base_url       Model API endpoint (required with api_key)
#   api_key        API key (required with base_url)
#
# Auth-only profiles may omit both base_url and api_key or leave both empty.
# Leaving an auth-only profile snapshots ~/.codex/auth.json by profile name;
# returning to that profile restores its snapshot.
# API key profiles write model_provider = "OpenAI"; base_url is copied unchanged,
# and api_key maps to experimental_bearer_token under model_providers.OpenAI.
# They also rewrite auth.json to contain only OPENAI_API_KEY, as before.
# All other fields are copied unchanged into model_providers.OpenAI.
# The native name is fixed to "OpenAI". Defaults: wire_api = "responses", requires_openai_auth = false,
# and http_headers = { "x-openai-actor-authorization" = "local-image-extension" }.
# Extra fields override defaults; the native name and common credentials take precedence.

[official]
display_name = "OpenAI"
description = "OpenAI 官方订阅"

# Example: custom API endpoint
#
# [global-infra]
# display_name = "Global Infra"
# description = "Subscription access"
# base_url = "https://global-infra.net"
# api_key = "sk-xxx"
# request_max_retries = 5
# supports_websockets = true
