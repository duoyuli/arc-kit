# Claude Code provider configuration
#
# Each [section] is a switchable provider profile.
# Switch with: arc provider use <name> --agent claude
#
# Common fields (all strings):
#   display_name   Name shown when switching (required)
#   description    Short description (required)
#   base_url       Model API endpoint (required with api_key)
#   api_key        API key (required with base_url)
#
# Auth-only profiles may omit both base_url and api_key or leave both empty.
# base_url maps to ANTHROPIC_BASE_URL; api_key maps to ANTHROPIC_AUTH_TOKEN.
# Other fields are converted to JSON and written to settings.json's env object.
# Switching removes fields managed by the previous profile and keeps unrelated settings.

[official]
display_name = "Anthropic"
description = "Anthropic 官方订阅"

